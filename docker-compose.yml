services:
  db:
    image: postgres:16-alpine
    container_name: np2-rbac-db
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: np2_rbac
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d np2_rbac"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build: .
    container_name: np2-rbac-api
    environment:
      PORT: 3000
      JWT_SECRET: ${JWT_SECRET:-troque_esta_chave_em_producao}
      JWT_EXPIRES_IN: 8h
      DATABASE_URL: postgres://postgres:postgres@db:5432/np2_rbac
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "node init-db.js && node src/server.js"

volumes:
  pgdata:
